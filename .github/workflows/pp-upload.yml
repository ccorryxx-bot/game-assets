name: PP Game Image Upload

on:
  workflow_dispatch:

jobs:
  upload-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Run PP image upload pipeline (Python)
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.error
          import json
          import base64
          import os
          import time

          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          GIT_TOKEN = os.environ["GIT_TOKEN"]
          GH_REPO = "ccorryxx-bot/game-assets"

          def fetch_json(url, headers):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def download_image(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  "Accept": "image/webp,image/apng,image/*,*/*;q=0.8",
                  "Referer": "https://www.pragmaticplay.com/"
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def upload_github(game_code, img_bytes):
              b64 = base64.b64encode(img_bytes).decode()
              url = f"https://api.github.com/repos/{GH_REPO}/contents/pp/{game_code}.jpg"
              body = json.dumps({"message": f"feat: add PP game image {game_code}", "content": b64}).encode()
              req = urllib.request.Request(url, data=body, method="PUT", headers={
                  "Authorization": f"token {GIT_TOKEN}",
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json"
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.getcode()
              except urllib.error.HTTPError as e:
                  return e.code

          def update_db(record_id, game_code, supabase_key):
              new_url = f"https://cdn.jsdelivr.net/gh/{GH_REPO}@main/pp/{game_code}.jpg"
              body = json.dumps({"image_url": new_url}).encode()
              req = urllib.request.Request(
                  f"https://xjqrwcsxiaybpztzestb.supabase.co/rest/v1/game_cards?id=eq.{record_id}",
                  data=body, method="PATCH",
                  headers={
                      "apikey": supabase_key,
                      "Authorization": f"Bearer {supabase_key}",
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal"
                  })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.getcode()
              except urllib.error.HTTPError as e:
                  return e.code

          print("=== Fetching games from Supabase ===")
          games = fetch_json(
              "https://xjqrwcsxiaybpztzestb.supabase.co/rest/v1/game_cards"
              "?provider_code=eq.pp&image_url=like.*pragmaticplay.net*&select=id,game_code,image_url&limit=500",
              {"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"}
          )
          print(f"Found {len(games)} games.\n")

          stats = {"downloaded": 0, "uploaded": 0, "skipped": 0, "db_updated": 0, "failed": []}

          for idx, game in enumerate(games):
              gid = game["id"]
              code = game["game_code"]
              url = game["image_url"]

              try:
                  img = download_image(url)
                  stats["downloaded"] += 1
              except Exception as e:
                  print(f"  FAIL {code} [download]: {e}")
                  stats["failed"].append({"code": code, "step": "download", "error": str(e)})
                  continue

              gh_status = None
              for attempt in range(2):
                  gh_status = upload_github(code, img)
                  if gh_status in (201, 422):
                      break
                  time.sleep(3)

              if gh_status == 201:
                  stats["uploaded"] += 1
                  print(f"  OK {code} [uploaded]")
              elif gh_status == 422:
                  stats["skipped"] += 1
                  print(f"  SKIP {code} [already exists]")
              else:
                  print(f"  FAIL {code} [github HTTP {gh_status}]")
                  stats["failed"].append({"code": code, "step": "github", "error": f"HTTP {gh_status}"})
                  continue

              db_status = update_db(gid, code, SUPABASE_KEY)
              if db_status == 204:
                  stats["db_updated"] += 1
              else:
                  print(f"  WARN {code} [db HTTP {db_status}]")

              if (idx + 1) % 20 == 0:
                  print(f"--- Progress: {idx+1}/{len(games)} ---")

          print("\n=== FINAL REPORT ===")
          print(f"Total:      {len(games)}")
          print(f"Downloaded: {stats['downloaded']}")
          print(f"Uploaded:   {stats['uploaded']}")
          print(f"Skipped:    {stats['skipped']}")
          print(f"DB updated: {stats['db_updated']}")
          print(f"Failed:     {len(stats['failed'])}")
          if stats["failed"]:
              print("\nFailed list:")
              for f in stats["failed"]:
                  print(f"  x {f['code']} [{f['step']}]: {f['error']}")
          PYEOF
