name: PP Game Image Upload

on:
  workflow_dispatch:

jobs:
  upload-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install dependencies
        run: sudo apt-get install -y jq dnsutils

      - name: Test connectivity to pragmaticplay.net
        run: |
          echo "=== DNS Test ==="
          nslookup static.pragmaticplay.net || echo "DNS FAILED"
          echo "=== Curl Test (verbose) ==="
          curl -v --max-time 15 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36" \
            -H "Referer: https://www.pragmaticplay.com/" \
            "https://static.pragmaticplay.net/game_pic/square/vs10farming/vs10farming_en.png" \
            -o /tmp/test_img.png 2>&1 | head -60
          echo "File size: $(wc -c < /tmp/test_img.png 2>/dev/null || echo 0) bytes"

      - name: Run PP image upload pipeline
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          echo "=== Fetching game list from Supabase ==="
          GAMES=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "https://xjqrwcsxiaybpztzestb.supabase.co/rest/v1/game_cards?provider_code=eq.pp&image_url=like.*pragmaticplay.net*&select=id,game_code,image_url&limit=500")

          TOTAL=$(echo "$GAMES" | jq length)
          echo "Found $TOTAL games."

          DOWNLOADED=0; UPLOADED=0; SKIPPED=0; DB_UPDATED=0; FAILED=0

          mkdir -p /tmp/pp_images

          for i in $(seq 0 $((TOTAL - 1))); do
            ID=$(echo "$GAMES" | jq -r ".[$i].id")
            GAME_CODE=$(echo "$GAMES" | jq -r ".[$i].game_code")
            IMAGE_URL=$(echo "$GAMES" | jq -r ".[$i].image_url")
            OUT_FILE="/tmp/pp_images/${GAME_CODE}.jpg"

            HTTP_CODE=$(curl -s -o "$OUT_FILE" -w "%{http_code}" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36" \
              -H "Accept: image/webp,image/apng,image/*,*/*;q=0.8" \
              -H "Referer: https://www.pragmaticplay.com/" \
              --max-time 30 --retry 2 --retry-delay 3 \
              "$IMAGE_URL" 2>/dev/null)
            CURL_EXIT=$?

            if [ "$HTTP_CODE" != "200" ] || [ ! -s "$OUT_FILE" ]; then
              echo "  FAIL $GAME_CODE [HTTP=$HTTP_CODE exit=$CURL_EXIT]"
              FAILED=$((FAILED + 1))
              continue
            fi
            DOWNLOADED=$((DOWNLOADED + 1))

            B64=$(base64 -w 0 "$OUT_FILE")

            GH_RESP=$(curl -s -o /tmp/gh_resp.json -w "%{http_code}" \
              -X PUT "https://api.github.com/repos/ccorryxx-bot/game-assets/contents/pp/${GAME_CODE}.jpg" \
              -H "Authorization: token $GIT_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              -d "{\"message\":\"feat: add PP game image ${GAME_CODE}\",\"content\":\"${B64}\"}" 2>/dev/null)

            if [ "$GH_RESP" = "201" ]; then
              UPLOADED=$((UPLOADED + 1))
              echo "  OK $GAME_CODE [uploaded]"
            elif [ "$GH_RESP" = "422" ]; then
              SKIPPED=$((SKIPPED + 1))
              echo "  SKIP $GAME_CODE [exists]"
            else
              echo "  FAIL $GAME_CODE [github HTTP=$GH_RESP]"
              FAILED=$((FAILED + 1))
              rm -f "$OUT_FILE"
              continue
            fi

            DB_RESP=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              "https://xjqrwcsxiaybpztzestb.supabase.co/rest/v1/game_cards?id=eq.${ID}" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"image_url\":\"https://cdn.jsdelivr.net/gh/ccorryxx-bot/game-assets@main/pp/${GAME_CODE}.jpg\"}" 2>/dev/null)

            [ "$DB_RESP" = "204" ] && DB_UPDATED=$((DB_UPDATED + 1)) || echo "  WARN $GAME_CODE [db=$DB_RESP]"
            rm -f "$OUT_FILE"

            DONE=$((DOWNLOADED + FAILED))
            [ $((DONE % 20)) -eq 0 ] && echo "--- Progress: $DONE/$TOTAL ---"
          done

          echo ""
          echo "=== FINAL REPORT ==="
          echo "Total:      $TOTAL"
          echo "Downloaded: $DOWNLOADED"
          echo "Uploaded:   $UPLOADED"
          echo "Skipped:    $SKIPPED"
          echo "DB updated: $DB_UPDATED"
          echo "Failed:     $FAILED"
