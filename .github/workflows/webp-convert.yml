name: Convert images to WebP

on:
  workflow_dispatch:
  push:
    paths:
      - 'pg/**'
      - 'pp/**'
      - 'jili/**'
      - 'jdb/**'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WebP tools
        run: sudo apt-get install -y webp

      - name: Convert JPG and PNG to WebP
        run: |
          COUNT=0
          for f in pg/*.jpg pg/*.png pp/*.jpg pp/*.png jili/*.jpg jili/*.png jdb/*.jpg jdb/*.png; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            w="${base}.webp"
            [ -f "$w" ] && continue
            cwebp -q 80 -resize 200 267 "$f" -o "$w" -quiet
            COUNT=$((COUNT+1))
            echo "  converted: $f → $w"
          done
          echo "Total converted: $COUNT files"

      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "feat: WebP thumbnails (200x267, q80)"
          git push
